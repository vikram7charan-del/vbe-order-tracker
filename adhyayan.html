         '<div style="display:flex;gap:.4rem"><input class="fld" id="a-key" type="password" placeholder="'+(hasKey?'••••••••  (जुड़ी हुई है)':'यहाँ चिपकाइए')+'" autocomplete="off">'+
         '<button class="btn pri" id="a-key-save">सहेजें</button></div>'+
         (hasKey?'<div class="filt" style="margin-top:.5rem"><button id="a-key-del">कुंजी हटाएँ</button></div>':'')+
         '</div>';
    h += '<div class="row"><div class="lab">Model</div><div class="chips">'+
         (C.models||[]).map(function(m){
           return '<button data-model="'+esc(m)+'" aria-pressed="'+(modelOf()===m)+'">'+esc(m.replace(/^gemini-|^hi-IN-/,''))+'</button>'; }).join('')+
         '</div></div>';
  }
  if(p==='gemini'){
    h += '<div class="row" style="display:block"><div class="lab" style="text-align:right;margin-bottom:.5rem">आवाज़ चुनिए</div>'+
         '<div class="chips" style="justify-content:flex-start">'+
         C.voices.map(function(v){
           return '<button data-voice="'+v+'" aria-pressed="'+(SET.voice===v)+'">'+v+'</button>'; }).join('')+
         '</div><div class="filt" style="margin-top:.5rem"><button id="a-sample">▶ नमूना सुनें (5 सेकंड)</button></div></div>';
  }
  h += '<div class="row" style="display:block"><div class="lab" style="text-align:right;margin-bottom:.5rem">कैसा अंदाज़</div>'+
       '<div class="chips" style="justify-content:flex-start">'+
       Object.keys(STYLES).map(function(k){
         return '<button data-style="'+k+'" aria-pressed="'+(SET.style===k)+'">'+STYLES[k].nm+'</button>'; }).join('')+
       '</div>'+
       (SET.style==='custom'
         ? '<textarea class="fld" id="a-custom" style="margin-top:.6rem" placeholder="अंग्रेज़ी में लिखिए कि आवाज़ कैसी हो — जैसे: Narrate in Hindi in a low, unhurried, cinematic voice…">'+esc(SET.custom||'')+'</textarea>'+
           '<div class="filt" style="margin-top:.4rem"><button id="a-custom-save">यह अंदाज़ सहेजें</button></div>'
         : '<div class="hint">'+esc(STYLES[SET.style].p)+'</div>')+
       '</div>';
  h += '<div class="row"><div class="lab">रफ़्तार</div><div class="chips">'+
       RATES.map(function(r){ return '<button data-rate="'+r+'" aria-pressed="'+(SET.rate===r)+'">'+r+'×</button>'; }).join('')+
       '</div></div>';
  h += '<div class="row"><div class="lab">आगे का कितना पहले से तैयार<small>जितना ज़्यादा, उतना बिना रुके</small></div><div class="chips">'+
       [0,1,2,3].map(function(n){ return '<button data-pf="'+n+'" aria-pressed="'+(SET.prefetch===n)+'">'+n+'</button>'; }).join('')+
       '</div></div>';
  if(B){
    h += '<div class="row"><div class="lab">पूरा अध्याय पहले से तैयार करें<small>फिर बिना इंटरनेट भी सुन सकेंगे</small></div>'+
         '<div class="chips"><button id="a-prep">तैयार करें</button></div></div>';
  }
  h += '<div class="row"><div class="lab">तैयार आवाज़ का संग्रह<small id="a-cache">'+esc(_cacheTxt)+'</small></div>'+
       '<div class="chips">'+(B?'<button id="a-clr-book">इस किताब की</button>':'')+'<button id="a-clr-all">सब साफ़</button></div></div>';
  h += '<div class="hint">कुंजी इसी browser में रहती है — न कोड में, न इंटरनेट पर। '+
       'आगे चलकर एक proxy लगाकर उसे पूरी तरह छिपाया जा सकता है।</div>';
  return h;
}
function audioSettingsHTML(){
  var p=SET.provider, hasKey=!!keyOf(p);
  return '<div class="row"><div class="lab">आवाज़ की व्यवस्था'+
         '<small>'+esc(TTS_CONFIG[p].nm)+' · '+(p==='web'?'कुंजी नहीं चाहिए':(hasKey?'कुंजी जुड़ी है':'कुंजी बाक़ी है'))+
         (p==='gemini'?' · '+esc(SET.voice):'')+'</small></div>'+
         '<div class="chips"><button id="set-audio">खोलें</button></div></div>';
}
function audioWire(){
  cacheInfo(function(tot,books,n){
    _cacheTxt = n ? (Math.round(tot/1048576*10)/10)+' MB · '+Object.keys(books).length+' पुस्तक · '+n+' टुकड़े' : 'अभी कुछ तैयार नहीं';
    var e=$('#a-cache'); if(e) e.textContent=_cacheTxt;
  });
}
function audioClick(t){
  if(t.dataset.prov){ SET.provider=t.dataset.prov; SET.model=''; saveSet(); renderSheet('audio'); return; }
  if(t.dataset.model){ SET.model=t.dataset.model; saveSet(); renderSheet('audio'); return; }
  if(t.dataset.voice){ SET.voice=t.dataset.voice; saveSet(); renderSheet('audio'); return; }
  if(t.dataset.style){ SET.style=t.dataset.style; saveSet(); renderSheet('audio'); return; }
  if(t.dataset.rate){ SET.rate=+t.dataset.rate; saveSet(); var a=Audio_.el(); if(a) a.playbackRate=SET.rate; Audio_.setPl(Audio_.isPlaying()); renderSheet('audio'); return; }
  if(t.dataset.pf!=null){ SET.prefetch=+t.dataset.pf; saveSet(); renderSheet('audio'); return; }
  if(t.id==='set-audio'){ renderSheet('audio'); curTab='audio';
    $$('#sheet-tabs button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.tab==='audio'?'true':'false'); }); return; }
  if(t.id==='a-key-save'){
    var v=($('#a-key')||{}).value||'';
    if(!v.trim()){ toast('कुंजी खाली है',2000); return; }
    lsSet(TTS_CONFIG[SET.provider].keyName, v.trim());
    toast('कुंजी सहेज ली — अब आवाज़ चल सकेगी',3000); renderSheet('audio'); return; }
  if(t.id==='a-key-del'){ lsDel(TTS_CONFIG[SET.provider].keyName); toast('कुंजी हटा दी',2000); renderSheet('audio'); return; }
  if(t.id==='a-custom-save'){ SET.custom=($('#a-custom')||{}).value||''; saveSet(); toast('आपका अंदाज़ सहेज लिया',2400); return; }
  if(t.id==='a-sample'){ sample(t); return; }
  if(t.id==='a-prep'){ prepChapter(t); return; }
  if(t.id==='a-clr-book'){
    dbAll().then(function(all){ return dbDel(all.filter(function(x){ return x.book===B.id; }).map(function(x){ return x.k; })); })
      .then(function(){ toast('इस किताब की तैयार आवाज़ हटा दी',2400); renderSheet('audio'); audioWire(); });
    return; }
  if(t.id==='a-clr-all'){
    if(!confirm('सारी तैयार आवाज़ मिट जाएगी। मिटाएँ?')) return;
    dbAll().then(function(all){ return dbDel(all.map(function(x){ return x.k; })); })
      .then(function(){ toast('संग्रह साफ़ कर दिया',2200); renderSheet('audio'); audioWire(); });
    return; }
}
var sampleUrl=null;
function sample(btn){
  var txt='यही आवाज़ आपकी किताब पढ़कर सुनाएगी। ध्यान से सुनिए — यह अंदाज़ आपको कैसा लगा?';
  var k='sample|'+SET.provider+'|'+modelOf()+'|'+SET.voice+'|'+SET.style+'|'+hash32(styleText());
  btn.textContent='बन रही है…'; btn.disabled=true;
  dbGet(k).then(function(rec){ return rec&&rec.blob ? rec.blob : synth(txt).then(function(b){ dbPut({k:k,book:'_sample',blob:b,size:b.size,used:Date.now()}); return b; }); })
    .then(function(blob){
      Audio_.unlock();
      if(sampleUrl) URL.revokeObjectURL(sampleUrl);
      sampleUrl=URL.createObjectURL(blob);
      var a=new Audio(sampleUrl); a.playbackRate=SET.rate;
      a.play().catch(function(){ toast('नमूना चल नहीं पाया — बटन दोबारा दबाइए',2800); });
      btn.textContent='▶ नमूना सुनें (5 सेकंड)'; btn.disabled=false;
    })
    .catch(function(e){ console.error(e); toast(errText(e),4200); btn.textContent='▶ नमूना सुनें'; btn.disabled=false; });
}
function prepChapter(btn){
  var ch = FLAT[curIdx] ? CH[FLAT[curIdx].ch] : CH[0];
  if(!ch) return;
  var list = Audio_.build(ch.from).filter(function(c,i){ return true; });
  /* सिर्फ़ इसी अध्याय जितना */
  var lastIdx = ch.to;
  var cs = Audio_.chunks();
  if(!cs.length){ toast('तैयार करने को कुछ नहीं',2200); return; }
  Audio_.prepReset();
  $('#prep').classList.add('on');
  var i=0, okN=0;
  function step(){
    if(Audio_.prepFlag()){ $('#prep').classList.remove('on'); toast('रोक दिया — '+okN+' हिस्से तैयार हैं',2800); audioWire(); return; }
    if(i>=cs.length){ $('#prep').classList.remove('on'); toast('अध्याय तैयार — अब बिना इंटरनेट भी सुन सकते हैं',3400); audioWire(); return; }
    $('#prep-t').textContent = 'तैयार हो रहा है… '+(i+1)+'/'+cs.length;
    $('#prep-i').style.width = Math.round(i/cs.length*100)+'%';
    Audio_.fetchClip(cs[i]).then(function(){ okN++; i++; step(); },
      function(e){ $('#prep').classList.remove('on'); toast(errText(e),4200); audioWire(); });
  }
  step();
}
$('#prep-x').addEventListener('click',function(){ Audio_.prepAbort(); });

/* ══════════ player के बटन ══════════ */
$('#pl-play').addEventListener('click',function(){ Audio_.toggle(); });
$('#pl-b15').addEventListener('click',function(){ Audio_.seek(-15); });
$('#pl-f30').addEventListener('click',function(){ Audio_.seek(30); });
$('#pl-stop').addEventListener('click',function(){ Audio_.stop(); });
$('#pl-rate').addEventListener('click',function(){
  var i=RATES.indexOf(SET.rate); SET.rate=RATES[(i+1)%RATES.length]; saveSet();
  var a=Audio_.el(); if(a) a.playbackRate=SET.rate;
  this.textContent=SET.rate+'×';
});
$('#pl-min').addEventListener('click',function(){
  var p=$('#player'); p.classList.toggle('mini');
  this.setAttribute('aria-label', p.classList.contains('mini')?'बड़ा करें':'छोटा करें');
});
$('#player').addEventListener('click',function(e){
  var p=$('#player');
  if(p.classList.contains('mini') && !e.target.closest('#pl-play')) p.classList.remove('mini');
});
$('#pl-bar').addEventListener('click',function(e){
  var a=Audio_.el(); if(!a||!a.duration) return;
  var r=this.getBoundingClientRect();
  a.currentTime = clamp((e.clientX-r.left)/r.width,0,1)*a.duration;
});

/* ══════════ ध्यान-मोड ══════════ */
function setFocus(on){
  focusOn=on; BODY.dataset.focus = on?'1':'0';
  if(on){
    lsSet('sr:themeBefore', SET.theme);
    if(SET.theme!=='focus'){ SET.theme='focus'; saveSet(); }
    toast('ध्यान-मोड — बाहर निकलने के लिए दो बार दबाइए',3200);
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
  } else {
    var t=lsGet('sr:themeBefore','midnight');
    if(SET.theme==='focus'){ SET.theme = t==='focus'?'midnight':t; saveSet(); }
    $('#rhead').classList.remove('up'); $('#fab').classList.remove('hide');   /* बाहर आते ही सब लौट आए */
    lastY = scrollY;
  }
  measureTop();
}

/* ══════════ दो बार दबाना ══════════ */
var lastTap=0;
$('#rbody').addEventListener('click',function(e){
  if(e.target.closest('mark.hl')||e.target.closest('.dbtn')) return;
  var sel=window.getSelection();
  if(sel && !sel.isCollapsed) return;
  var t=Date.now();
  if(t-lastTap<330){
    lastTap=0;
    if(focusOn) setFocus(false); else openSheet('ctrl');
  } else lastTap=t;
});

/* ══════════ header और बाक़ी बटन ══════════ */
$('#r-back').addEventListener('click',function(){ if(focusOn){ setFocus(false); return; } toLib(); });
$('#r-find').addEventListener('click',function(){ openSheet('find'); });
$('#r-audio').addEventListener('click',function(){ if(Audio_.isPlaying()) openSheet('audio'); else Audio_.start(); });
$('#r-more').addEventListener('click',function(){ moreMenu(); });
$('#fab').addEventListener('click',function(){ openSheet('bahi'); });
function moreMenu(){ openSheet('ctrl'); }

/* यहाँ चिह्न लगाएँ — बही में जगह सहेजना */
function addBookmark(){
  var f=FLAT[curIdx]; if(!f) return;
  if(BM.some(function(b){ return b.p===f.id; })){ toast('यहाँ पहले से चिह्न लगा है',2200); return; }
  BM.push({ i:uid(), p:f.id, t:(f.t||'').slice(0,120)+((f.t||'').length>120?'…':''), n:'', at:Date.now(), bm:1 });
  jSet('sr:bm:'+B.id,BM); refreshFab();
  toast('चिह्न लग गया — "मेरी बही" में मिलेगा',2600);
}

/* ══════════ पुस्तकालय के दबाव ══════════ */
$('#lib-body').addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.open){ location.hash='#'+t.dataset.open+(t.dataset.resume?'/~':''); return; }
  if(t.id==='lib-ins'){ openSheet('ins'); return; }
  if(t.id==='lib-set'){ openSheet('set'); return; }
  if(t.id==='lib-granth'){ location.href='granth.html'; return; }
});
function toLib(){
  Audio_.stop();
  setView('lib'); renderLib();
  if(location.hash) history.replaceState(null,'','#');
  window.scrollTo(0,0);
}

/* ══════════ कुंजीपटल ══════════ */
addEventListener('keydown',function(e){
  if(/input|textarea/i.test((e.target.tagName||''))) return;
  if(e.key===' '&&view==='read'){ e.preventDefault(); Audio_.toggle(); return; }
  if(e.key==='ArrowRight'&&view==='read'&&Audio_.isPlaying()){ Audio_.seek(30); return; }
  if(e.key==='ArrowLeft'&&view==='read'&&Audio_.isPlaying()){ Audio_.seek(-15); return; }
  if((e.key==='f'||e.key==='F')&&view==='read'){ setFocus(!focusOn); return; }
  if(e.key==='/'&&view==='read'){ e.preventDefault(); openSheet('find'); return; }
  if(e.key==='Escape'){ if(sheetOpen) closeSheet(); else if($('#noteed').classList.contains('on')) $('#ne-x').click(); else if(focusOn) setFocus(false); }
});

/* ══════════ रास्ता (hash) ══════════ */
function route(){
  var h=(location.hash||'').replace(/^#/,'');
  if(!h){ setView('lib'); renderLib(); return; }
  var p=h.split('/'), id=p[0], where=p[1]||'';
  if(!REG.some(function(x){ return x.id===id; })){ setView('lib'); renderLib(); return; }
  if(B && B.id===id){
    setView('read');
    if(where && where!=='~') jumpTo(where);
    return;
  }
  openBook(id, where==='~' || !where, false);
  if(where && where!=='~') setTimeout(function(){ jumpTo(where); }, 500);
}
addEventListener('hashchange',route);
document.addEventListener('visibilitychange',function(){ if(document.hidden) trackTime(); });

/* ══════════ चालू ══════════ */
loadRegistry(function(){
  renderLib();
  measureTop();
  route();
});
})();
</script>
