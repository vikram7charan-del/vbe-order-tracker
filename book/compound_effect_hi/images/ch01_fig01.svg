<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Noto Sans Devanagari','Noto Sans',sans-serif">
  <rect width="800" height="560" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">फ़िगर 1</text>

  <!-- Axes -->
  <line x1="130" y1="60" x2="130" y2="460" stroke="#111" stroke-width="3"/>
  <line x1="130" y1="460" x2="740" y2="460" stroke="#111" stroke-width="3"/>

  <!-- Y axis label group -->
  <text x="120" y="90" text-anchor="end" font-size="16" fill="#111">परिणाम :</text>
  <text x="120" y="115" text-anchor="end" font-size="15" fill="#333">आमदनी</text>
  <text x="120" y="140" text-anchor="end" font-size="15" fill="#333">स्वास्थ्य</text>
  <text x="120" y="165" text-anchor="end" font-size="15" fill="#333">संबंध</text>
  <text x="120" y="190" text-anchor="end" font-size="15" fill="#333">खुशी</text>
  <text x="120" y="215" text-anchor="end" font-size="15" fill="#333">सफलता</text>

  <!-- Center big label -->
  <text x="400" y="150" text-anchor="middle" font-size="30" font-weight="bold" fill="#111">27 महीने</text>
  <text x="400" y="220" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">चयन   व्यवहार   आदतें</text>

  <!-- Flat then rising curve -->
  <path d="M 130,260 L 560,260 C 620,260 650,240 680,180 C 700,140 715,100 730,80"
        fill="none" stroke="#999" stroke-width="6"/>

  <!-- Month ticks -->
  <g stroke="#111" stroke-width="1">
    <line x1="230" y1="455" x2="230" y2="465"/>
    <line x1="400" y1="455" x2="400" y2="465"/>
    <line x1="560" y1="455" x2="560" y2="465"/>
  </g>
  <text x="130" y="490" text-anchor="middle" font-size="15" fill="#111">महीने</text>
  <text x="230" y="490" text-anchor="middle" font-size="15" fill="#111">10</text>
  <text x="400" y="490" text-anchor="middle" font-size="15" fill="#111">20</text>
  <text x="560" y="490" text-anchor="middle" font-size="15" fill="#111">27</text>

  <!-- Silhouettes: seated, standing, walking-up -->
  <g fill="#444">
    <!-- seated figure near x=130 -->
    <circle cx="150" cy="435" r="9"/>
    <rect x="142" y="444" width="16" height="14" rx="3"/>
    <!-- standing figure near x=560 -->
    <circle cx="560" cy="330" r="10"/>
    <rect x="551" y="340" width="18" height="60" rx="4"/>
    <!-- walking/rising figure near x=730,y=80 -->
    <circle cx="730" cy="60" r="10"/>
    <rect x="721" y="70" width="18" height="55" rx="4"/>
  </g>

  <!-- Caption -->
  <foreignObject x="60" y="500" width="680" height="55">
    <p xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; color:#222; margin:0; line-height:1.4;">
      संचयी परिणाम के सिद्धांत की सुंदरता इसकी सरलता है। ग़ौर करें कि रेखाचित्र के बाईं तरफ़ के परिणाम अमूर्त हैं, लेकिन बाद में वे कितने ज़्यादा अलग हैं। व्यवहार पूरे समय एक जैसा रहा है, लेकिन संचयी परिणाम का जादू अंत में परिणामों में भारी फ़र्क़ दिखाता है।
    </p>
  </foreignObject>
</svg>
