<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1220">
<title>॥ ग्रंथ पुस्तकालय ॥ — हरिरस · देवियांण</title>
<style>
/* ===================== tokens ===================== */
:root{
  color-scheme:light;
  /* per-granth, set from data/registry — 240ms transition */
  --accent:#B4862A;
  --glow:rgba(212,160,23,.55);
  --deep:#0B1220;

  --bg:#F1E7D3;
  --paper:#FCF6E7;
  --paper-2:#F6EDD8;
  --ink:#1B2740;
  --ink-soft:#3B3627;
  --muted:#6E6250;
  --rule:rgba(0,0,0,.12);
  --glass:rgba(252,246,231,.88);
  --glass-brd:rgba(0,0,0,.10);
  --shadow:0 14px 34px rgba(74,54,22,.10), 0 2px 8px rgba(74,54,22,.07);
  --chip:rgba(0,0,0,.05);
  --sheet:#FCF6E7;
  --on-accent:#1A1206;
  --fs:1;
  --safe-b:env(safe-area-inset-bottom,0px);
  --t:240ms;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:var(--deep);
  --paper:rgba(255,255,255,.045);
  --paper-2:rgba(255,255,255,.02);
  --ink:#EDE3CB;
  --ink-soft:#CFC5AE;
  --muted:#98A3B8;
  --rule:rgba(255,255,255,.14);
  --glass:rgba(10,14,26,.86);
  --glass-brd:rgba(255,255,255,.13);
  --shadow:0 16px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
  --chip:rgba(255,255,255,.07);
  --sheet:#101725;
  --on-accent:#141A26;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    color-scheme:dark;
    --bg:var(--deep);
    --paper:rgba(255,255,255,.045);
    --paper-2:rgba(255,255,255,.02);
    --ink:#EDE3CB;
    --ink-soft:#CFC5AE;
    --muted:#98A3B8;
    --rule:rgba(255,255,255,.14);
    --glass:rgba(10,14,26,.86);
    --glass-brd:rgba(255,255,255,.13);
    --shadow:0 16px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
    --chip:rgba(255,255,255,.07);
    --sheet:#101725;
    --on-accent:#141A26;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans Devanagari','Nirmala UI','Mangal',system-ui,-apple-system,'Segoe UI',sans-serif;
  line-height:1.75;
  padding:0 0 calc(7rem + var(--safe-b));
  transition:background var(--t) ease, color var(--t) ease;
}
.pad{font-family:'Tiro Devanagari Hindi','Noto Serif Devanagari','Sanskrit Text','Nirmala UI',serif}
.wrap{max-width:680px;margin:0 auto;padding:0 1.05rem}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* ===================== ग्रंथ पट्टी ===================== */
.gbar{position:sticky;top:0;z-index:70;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--glass-brd)}
.gscroll{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:.55rem 1.05rem;max-width:680px;margin:0 auto;scrollbar-width:none;
  -webkit-mask:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);
  mask:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.gscroll::-webkit-scrollbar{display:none}
.gtab{scroll-snap-align:center;flex:none;display:flex;flex-direction:column;align-items:center;gap:.05rem;
  padding:.42rem 1rem .38rem;border-radius:999px;border:1px solid var(--glass-brd);background:var(--chip);
  position:relative;transition:.22s;min-height:44px}
.gtab .nm{font-size:1rem;font-weight:600;line-height:1.2;white-space:nowrap}
.gtab .sub{font-size:.64rem;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.gtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 16px var(--glow)}
.gtab[aria-selected="true"] .sub{color:var(--on-accent);opacity:.75}
.gtab[aria-selected="true"]::after{content:"";position:absolute;left:22%;right:22%;bottom:-6px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--glow)}
.gtab.soon{opacity:.45;border-style:dashed}
.gtab:active{transform:scale(.95)}

/* ===================== नियंत्रण पट्टी ===================== */
.topbar{position:sticky;top:0;z-index:60;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--glass-brd)}
.progress{height:3px;background:transparent}
.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent));box-shadow:0 0 10px var(--glow);transition:width .18s linear}
.bar{max-width:680px;margin:0 auto;padding:.5rem 1.05rem .55rem;display:flex;align-items:center;gap:.5rem}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--glass-brd);border-radius:999px;background:var(--chip);flex:1}
.seg button{flex:1;padding:.42rem .3rem;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap;transition:.22s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 10px var(--glow)}
.tool{width:38px;height:38px;min-width:38px;border-radius:12px;border:1px solid var(--glass-brd);display:grid;place-items:center;font-size:1rem;background:var(--chip);transition:.2s;position:relative}
.tool:active{transform:scale(.92)}
.tool .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.62rem;font-weight:700;display:grid;place-items:center;line-height:1}
.pathbar{display:none;max-width:680px;margin:0 auto;padding:0 1.05rem .55rem;align-items:center;gap:.45rem}
.pathbar.on{display:flex}
#difftog{margin-left:auto}
.plab{font-size:.72rem;letter-spacing:.16em;color:var(--muted);font-weight:700}
.pseg{display:flex;gap:2px;padding:3px;border:1px solid var(--glass-brd);border-radius:999px;background:var(--chip)}
.pseg button{min-width:40px;padding:.28rem .6rem;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--muted);transition:.2s}
.pseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px var(--glow)}
.difftog{padding:.32rem .7rem;border-radius:999px;border:1px solid var(--glass-brd);background:var(--chip);font-size:.76rem;font-weight:600;color:var(--muted);transition:.2s}
.difftog[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--chip)}

/* ===================== कवर ===================== */
.cover{position:relative;overflow:hidden;text-align:center;padding:2.8rem 1.05rem 2.2rem;isolation:isolate}
.yantra{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(120vw,540px);aspect-ratio:1;z-index:-1;opacity:.22;pointer-events:none}
.yantra .spin{transform-origin:100px 100px;animation:spin 60s linear infinite}
.yantra .breathe{transform-origin:100px 100px;animation:breathe 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
.halo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(86vw,380px);aspect-ratio:1;z-index:-2;
  background:radial-gradient(circle,var(--glow),transparent 62%);opacity:.42}
.cover .inv{font-size:1.6rem;color:var(--accent);letter-spacing:.04em}
.cover h1{font-weight:600;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.1;margin:.4rem 0 .5rem;color:var(--ink)}
.cover .sub{font-size:.82rem;letter-spacing:.32em;color:var(--accent);margin-bottom:.8rem}
.cover .range{display:inline-block;font-size:.9rem;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:.26rem 1rem;margin-bottom:.85rem}
.cover .by{color:var(--muted);font-size:.96rem}
.cover .by strong{color:var(--ink);font-weight:600}
.resume{margin:1.1rem auto 0;display:none;align-items:center;gap:.5rem;max-width:340px;padding:.6rem .75rem;border:1px solid var(--glass-brd);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);font-size:.88rem}
.resume.on{display:flex}
.resume b{color:var(--accent);font-weight:700}
.resume button{margin-left:auto;padding:.34rem .7rem;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.82rem}

/* ===================== भाग शीर्षक ===================== */
h2{font-weight:600;font-size:1.34rem;color:var(--ink);margin:2.8rem 0 1.5rem;padding:1rem 0 .9rem;text-align:center;position:relative;scroll-margin-top:104px}
h2 span{display:block;font-size:.68rem;letter-spacing:.24em;color:var(--accent);margin-bottom:.4rem;font-weight:700}
h2::before,h2::after{content:"◈";position:absolute;left:50%;transform:translateX(-50%);color:var(--accent);font-size:.7rem;opacity:.7}
h2::before{top:-.1rem}
h2::after{bottom:-.2rem}

/* ===================== पद-कार्ड ===================== */
.v{position:relative;margin:0 0 1.5rem;padding:1.7rem 1.15rem 1.05rem;border-radius:20px;
  background:linear-gradient(170deg,var(--paper),var(--paper-2));border:1px solid var(--glass-brd);box-shadow:var(--shadow);
  opacity:0;transform:translateY(16px);transition:opacity .2s ease,transform .2s ease}
.v.seen{opacity:1;transform:none}
.v::before{content:"";position:absolute;inset:7px;border-radius:14px;pointer-events:none;opacity:.42;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/16px 1px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top left/1px 16px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top right/16px 1px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top right/1px 16px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom left/16px 1px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom left/1px 16px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/16px 1px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/1px 16px no-repeat}
.v.reading{border-color:var(--accent);box-shadow:0 0 0 1px var(--glow),0 0 32px var(--glow),var(--shadow)}
.v.flash{animation:flash 2.2s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--accent),0 0 60px var(--glow),var(--shadow)}100%{box-shadow:var(--shadow)}}
.vnum{position:absolute;top:-.85rem;left:50%;transform:translateX(-50%);min-width:2.2rem;height:2.2rem;padding:0 .4rem;
  display:grid;place-items:center;background:linear-gradient(170deg,var(--paper),var(--paper-2));
  border:1px solid var(--accent);color:var(--accent);font-size:.9rem;font-weight:600;line-height:1;
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.vtext{font-size:calc(clamp(1.16rem,4.6vw,1.4rem) * var(--fs));line-height:1.9;text-align:center;padding:.3rem 0 .1rem;color:var(--ink)}
.vtext span{display:block}
.vtext span.on{color:var(--accent);text-shadow:0 0 18px var(--glow)}
.v.six .vtext{font-size:calc(clamp(1rem,3.9vw,1.18rem) * var(--fs));line-height:1.85}
.arth{margin-top:1rem;padding:.15rem 0 .15rem .85rem;border-left:2px solid var(--accent);
  font-size:calc(.99rem * var(--fs));color:var(--ink-soft);line-height:1.85}
.arth b{display:block;font-size:.66rem;letter-spacing:.22em;color:var(--accent);font-weight:700;margin-bottom:.35rem}
.pending{display:inline-block;margin-top:.9rem;padding:.2rem .7rem;border-radius:999px;border:1px dashed var(--glass-brd);
  font-size:.72rem;color:var(--muted)}
.vacts{display:flex;align-items:center;gap:.5rem;margin-top:.95rem;padding-top:.7rem;border-top:1px solid var(--rule)}
.vacts .sp{flex:1}
.vbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.4rem;min-height:40px;padding:.42rem .85rem;
  border-radius:999px;border:1px solid var(--glass-brd);background:var(--chip);font-size:.85rem;font-weight:600;color:var(--muted);transition:.2s}
.vbtn:active{transform:scale(.94)}
.vbtn.play{color:var(--accent)}
.vbtn.play .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.vbtn.play .ico .icon{width:13px;height:13px}
.v.reading .vbtn.play{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.v.reading .vbtn.play .ico{background:rgba(0,0,0,.2)}
.vbtn.bm{width:40px;padding:0;justify-content:center}
.vbtn.bm.on{color:var(--accent);border-color:var(--accent)}
.sep{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:0 0 1.5rem;color:var(--accent);opacity:.5;font-size:.7rem}
.sep::before,.sep::after{content:"";height:1px;width:52px;background:linear-gradient(90deg,transparent,currentColor,transparent)}

/* पाठ क/ख */
.ribbon{display:none;align-items:center;gap:.45rem;margin:0 0 .55rem}
.ribbon b{font-size:.62rem;letter-spacing:.18em;font-weight:700;color:var(--on-accent);background:var(--accent);padding:.16rem .58rem;border-radius:999px}
.ribbon .meta{font-size:.7rem;color:var(--muted);font-style:italic}
.pb{display:none;margin-top:1.1rem;padding-top:1rem;border-top:1px dashed var(--glass-brd)}
body[data-path="b"] .v.has-b>.vtext,body[data-path="b"] .v.has-b>.arth{display:none}
body[data-path="b"] .pb,body[data-path="both"] .pb{display:block}
body[data-path="both"] .v.has-b .ribbon{display:flex}
body[data-path="b"] .v:not(.has-b) .vtext::after{content:"पाठ ख अभी इस पद का नहीं जुड़ा — ऊपर पाठ क है";display:block;
  font-family:inherit;font-size:.72rem;color:var(--muted);margin-top:1rem;padding-top:.7rem;border-top:1px dashed var(--glass-brd)}
.dw{font-style:normal;background:linear-gradient(180deg,transparent 62%,var(--glow) 62%);border-radius:2px}
body[data-mode="verse"] .arth,body[data-mode="shravan"] .arth{display:none}
body[data-mode="shravan"] .vtext{font-size:calc(clamp(1.28rem,5.2vw,1.56rem) * var(--fs));line-height:2.1}


/* ===================== दो पाठ — समानांतर ===================== */
.cols{display:block}
.v.two .col{position:relative}
.rlab{display:none;align-items:center;gap:.4rem;margin:0 0 .6rem;font-size:.68rem;letter-spacing:.1em;font-weight:700}
.rlab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.col-k .rlab{color:var(--accent)} .col-k .rlab .dot{background:var(--accent);box-shadow:0 0 8px var(--glow)}
.col-kh .rlab{color:var(--muted)} .col-kh .rlab .dot{background:var(--muted)}
.meta-chips{display:flex;flex-wrap:wrap;gap:.32rem;margin:0 0 .7rem;justify-content:center}
.meta-chips span{font-size:.68rem;padding:.16rem .55rem;border-radius:999px;border:1px solid var(--glass-brd);background:var(--chip);color:var(--muted)}
.meta-chips span.ch{color:var(--accent);border-color:var(--accent)}
.sarth{margin-top:.8rem;padding:.15rem 0 .15rem .85rem;border-left:2px dotted var(--glass-brd);font-size:calc(.9rem * var(--fs));color:var(--muted)}
.sarth b{display:block;font-size:.62rem;letter-spacing:.2em;color:var(--muted);margin-bottom:.3rem}
.sarth i{font-style:normal;color:var(--ink-soft)}
.tipp{margin-top:.8rem;font-size:calc(.88rem * var(--fs));color:var(--muted);font-style:italic;padding-left:.85rem;border-left:2px dotted var(--glass-brd)}
.absent{margin:1.2rem 0 .4rem;text-align:center;font-size:.84rem;color:var(--muted);padding:1.1rem .6rem;
  border:1px dashed var(--glass-brd);border-radius:14px;background:var(--chip)}
.dcount{display:none;margin:0 0 .8rem;text-align:center;font-size:.72rem;letter-spacing:.06em;color:var(--accent)}
body[data-path="both"][data-diff="1"] .v.two .dcount{display:block}

/* किस मोड में कौन-सा स्तंभ */
body[data-path="k"]  .v.two .col-kh,
body[data-path="kh"] .v.two .col-k{display:none}
body[data-path="both"] .v.two .rlab{display:flex}
body[data-path="both"] .v.two .cols{display:grid;grid-template-columns:1fr;gap:1.4rem}
@media (min-width:768px){
  body[data-path="both"] .v.two .cols{grid-template-columns:1fr 1px 1fr;gap:1.1rem;align-items:start}
  body[data-path="both"] .v.two .cols::before{content:"";grid-column:2;align-self:stretch;
    background:linear-gradient(180deg,transparent,var(--glass-brd) 12%,var(--glass-brd) 88%,transparent)}
  body[data-path="both"] .v.two .col-k{grid-column:1}
  body[data-path="both"] .v.two .col-kh{grid-column:3}
  body[data-path="both"][data-swap="1"] .v.two .col-k{grid-column:3}
  body[data-path="both"][data-swap="1"] .v.two .col-kh{grid-column:1}
}
@media (max-width:767px){
  body[data-path="both"][data-swap="1"] .v.two .col-k{order:2}
  body[data-path="both"][data-swap="1"] .v.two .col-kh{order:1}
  body[data-path="both"] .v.two .cols{display:flex;flex-direction:column}
  /* मोबाइल पर एक बार में एक ही पाठ (सरकाकर बदलिए) */
  body[data-path="both"] .v.two[data-solo="k"] .col-kh,
  body[data-path="both"] .v.two[data-solo="kh"] .col-k{display:none}
  .v.two[data-solo] .swipehint{display:flex}
}
.swipehint{display:none;align-items:center;justify-content:center;gap:.4rem;margin-top:.7rem;font-size:.68rem;color:var(--muted)}
.swipehint b{display:inline-flex;gap:3px}
.swipehint i{width:6px;height:6px;border-radius:50%;background:var(--glass-brd);display:block}
.swipehint i.on{background:var(--accent)}
.mini{display:flex;gap:2px;padding:2px;border:1px solid var(--glass-brd);border-radius:999px;background:var(--chip)}
.mini button{padding:.1rem .5rem;border-radius:999px;font-size:.68rem;font-weight:700;color:var(--muted)}
.mini button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon.f{fill:currentColor;stroke:none}
.jump{display:flex;gap:.4rem;align-items:center;margin-bottom:.7rem}
.jump input{flex:1;min-width:0;padding:.6rem .8rem;border-radius:12px;border:1px solid var(--glass-brd);background:var(--chip);color:var(--ink);font:inherit;font-size:.92rem}
.jump button{padding:.6rem 1rem;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.88rem}
.sres{display:block;width:100%;text-align:right;padding:.65rem .7rem;border-radius:14px;border:1px solid var(--rule);margin-bottom:.4rem;background:var(--paper)}
.sres small{display:block;font-size:.68rem;letter-spacing:.1em;color:var(--accent);margin-bottom:.2rem}
.sres b{display:block;font-weight:400;font-size:.95rem;color:var(--ink)}
.sres mark{background:var(--glow);color:inherit;border-radius:3px;padding:0 2px}


/* ===================== गायन ===================== */
.gaanbar{position:fixed;left:50%;transform:translate(-50%,150%);bottom:calc(.7rem + var(--safe-b));width:min(94vw,520px);z-index:74;
  padding:.6rem .75rem .7rem;border-radius:18px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.gaanbar.on{transform:translate(-50%,0)}
.gaanbar .row{display:flex;align-items:center;gap:.5rem}
.gaanbar .ttl{flex:1;min-width:0;line-height:1.25}
.gaanbar .ttl b{display:block;font-size:.86rem;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gaanbar .ttl small{display:block;font-size:.66rem;color:var(--muted)}
.gaanbar .tm{font-size:.7rem;color:var(--muted);min-width:5.4rem;text-align:right;font-variant-numeric:tabular-nums}
.seekwrap{margin-top:.5rem;position:relative;height:22px;display:flex;align-items:center}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:var(--chip);outline:none}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow);cursor:pointer}
.seek::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--accent)}
.marks{position:absolute;left:0;right:0;top:3px;height:9px;pointer-events:none}
.marks i{position:absolute;top:0;width:2px;height:9px;border-radius:2px;background:var(--accent);opacity:.5}
.v.singing{border-color:var(--accent);box-shadow:0 0 0 1px var(--glow),0 0 30px var(--glow),var(--shadow)}
.vbtn.gaan{color:var(--accent)}
.follow[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

/* ===================== audio bar / fab / sheet / toast ===================== */
.audiobar{position:fixed;left:50%;transform:translate(-50%,140%);bottom:calc(.7rem + var(--safe-b));width:min(94vw,460px);z-index:75;
  display:flex;align-items:center;gap:.45rem;padding:.55rem .6rem;border-radius:18px;background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-brd);box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.audiobar.on{transform:translate(-50%,0)}
.audiobar .now{font-size:.86rem;color:var(--accent);min-width:5.2rem;padding-left:.35rem;line-height:1.25;font-weight:600}
.audiobar .now small{display:block;font-size:.62rem;letter-spacing:.12em;color:var(--muted);font-weight:400}
.ctl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--glass-brd);background:var(--chip);font-size:.95rem;transition:.2s}
.ctl:active{transform:scale(.9)}
.ctl.main{width:48px;height:48px;background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 0 18px var(--glow);font-size:1.05rem}
.ctl.rate{width:auto;padding:0 .6rem;font-size:.78rem;font-weight:700;color:var(--accent)}
.fab{position:fixed;right:.9rem;bottom:calc(1rem + var(--safe-b));z-index:65;display:flex;align-items:center;gap:.45rem;
  padding:.72rem 1rem;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.9rem;
  box-shadow:0 10px 26px rgba(0,0,0,.28),0 0 24px var(--glow);overflow:hidden;transition:transform .25s,opacity .25s}
.fab:active{transform:scale(.94)}
.fab.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:var(--glow);transform:translate(-50%,-50%) scale(0);opacity:.7;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(9);opacity:0}}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(6,6,10,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,102%);width:min(100vw,560px);max-height:82vh;z-index:85;
  background:var(--sheet);border:1px solid var(--glass-brd);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.32);
  display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.2,.7,.3,1);padding-bottom:var(--safe-b)}
.sheet.on{transform:translate(-50%,0)}

.sheet .tabs{display:flex;gap:2px;padding:.55rem .9rem;border-bottom:1px solid var(--rule)}

.sheet .tabs button[aria-pressed="true"]{background:var(--chip);color:var(--accent)}
.sheet .tabs .tab-x{flex:0 0 40px;border-radius:50%;color:var(--muted)}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.6rem .9rem 1.4rem}
.snav{display:block;width:100%;text-align:right;padding:.75rem .8rem;border-radius:14px;margin-bottom:.3rem}
.snav:active{background:var(--chip)}
.snav b{display:block;font-size:1rem;font-weight:600;color:var(--ink)}
.snav small{display:block;font-size:.7rem;letter-spacing:.14em;color:var(--accent);margin-bottom:.15rem}
.bmrow{display:flex;align-items:center;gap:.6rem;padding:.65rem .7rem;border-radius:14px;border:1px solid var(--rule);margin-bottom:.45rem;background:var(--paper)}
.bmrow .n{min-width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent);font-size:.85rem}
.bmrow .t{flex:1;font-size:.95rem;line-height:1.5;color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmrow .x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:2rem 1rem;font-size:.92rem}
.empty span{display:block;font-size:1.7rem;margin-bottom:.5rem;opacity:.6}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.75rem .2rem;border-bottom:1px solid var(--rule)}
.setrow:last-child{border-bottom:0}
.setrow .lab{font-size:.94rem}
.setrow .lab small{display:block;color:var(--muted);font-size:.76rem}
.chips{display:flex;gap:.3rem;flex:none}
.chips button{min-height:38px;padding:0 .7rem;border-radius:12px;border:1px solid var(--glass-brd);background:var(--chip);font-size:.82rem;font-weight:600;color:var(--muted);transition:.2s}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sw{width:52px;height:30px;border-radius:999px;border:1px solid var(--glass-brd);background:var(--chip);position:relative;flex:none;transition:.25s}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:.25s}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"] i{left:24px;background:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:calc(5.4rem + var(--safe-b));transform:translate(-50%,20px);z-index:90;
  padding:.65rem 1.05rem;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-brd);box-shadow:var(--shadow);font-size:.88rem;color:var(--ink);
  opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{padding:2rem 1.05rem;max-width:680px;margin:0 auto}
.skel i{display:block;height:14px;border-radius:8px;background:var(--chip);margin:0 auto .9rem;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.loaderr{text-align:center;padding:3rem 1.2rem;color:var(--muted)}
.loaderr button{margin-top:1rem;padding:.55rem 1.1rem;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700}
.closing{margin:3rem auto 0;max-width:680px;padding:1.6rem 1.05rem 0;border-top:1px solid var(--rule);text-align:center;color:var(--muted);font-size:.92rem}
.closing .l1{display:block;color:var(--accent);font-size:1.25rem;margin-bottom:.45rem;font-weight:600}
.closing .l2{display:block;color:var(--accent);opacity:.85;margin-bottom:.7rem}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .yantra .spin,.yantra .breathe,.skel i{animation:none!important}
  .v{opacity:1!important;transform:none!important;transition:none}
}
</style>
</head>

<script>
(function(){
"use strict";

var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function jGet(k,d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function jSet(k,v){ lsSet(k, JSON.stringify(v)); }
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var REG = (window.GRANTH_REGISTRY || []).slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });

/* ---------- साझा सेटिंग ---------- */
var SET = jGet('granth:settings', {});
if(SET.fontSize == null) SET.fontSize = 1;
if(SET.mode == null) SET.mode = 'both';
if(SET.ttsRate == null) SET.ttsRate = 1;
if(SET.theme == null) SET.theme = 'auto';
if(SET.bell == null) SET.bell = 1;
function saveSet(){ jSet('granth:settings', SET); }

/* ---------- पुराने hariras की याद बचाना (एक बार) ---------- */
(function migrate(){
  if(lsGet('granth:migrated','0') === '1') return;
  try{
    var old = JSON.parse(lsGet('hr_bm','[]')) || [];
    if(old.length){
      var cur = jGet('granth:hariras:bookmarks', []);
      old.forEach(function(n){
        if(!cur.some(function(b){ return b.n === n; })) cur.push({ sectionId: null, n: n, ts: Date.now() });
      });
      jSet('granth:hariras:bookmarks', cur);
    }
    var pos = parseInt(lsGet('hr_pos','0'), 10);
    if(pos) jSet('granth:hariras:lastRead', { sectionId: null, n: pos });
    var f = parseFloat(lsGet('hr_font','')); if(f) SET.fontSize = f;
    var m = lsGet('hr_mode',''); if(m) SET.mode = m;
    var r = parseFloat(lsGet('hr_rate','')); if(r) SET.ttsRate = r;
    var t = lsGet('hr_theme',''); if(t) SET.theme = t;
    var bl = lsGet('hr_bell',''); if(bl !== '') SET.bell = (bl === '1') ? 1 : 0;
    saveSet();
  }catch(e){}
  lsSet('granth:migrated','1');
})();

/* ---------- toast / bell ---------- */
var toastEl = $('#toast'), toastT;
function toast(m, ms){ toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, ms||2600); }
var AC = null;
function bell(){
  if(!SET.bell) return;
  try{
    var C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    AC = AC || new C(); if(AC.state === 'suspended') AC.resume();
    var t = AC.currentTime, g = AC.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.4); g.connect(AC.destination);
    [880,2373,3520].forEach(function(f,i){
      var o=AC.createOscillator(), og=AC.createGain();
      o.type='sine'; o.frequency.value=f; og.gain.value=[1,.4,.16][i];
      o.connect(og); og.connect(g); o.start(t); o.stop(t+1.5);
    });
  }catch(e){}
}
function haptic(){ try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} }

/* ---------- theme ---------- */
function applyTheme(v){
  if(v === 'dark' || v === 'light') document.documentElement.setAttribute('data-theme', v);
  else document.documentElement.removeAttribute('data-theme');
}
function applyFont(v){
  SET.fontSize = Math.min(1.7, Math.max(0.85, Math.round(v*100)/100));
  document.documentElement.style.setProperty('--fs', SET.fontSize);
  saveSet();
  var l = $('#fs-val'); if(l) l.textContent = Math.round(SET.fontSize*100) + '%';
}
function isDark(){
  var t = SET.theme;
  return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyGranthTheme(th){
  var r = document.documentElement.style;
  r.setProperty('--accent', th.accent);
  r.setProperty('--glow', hexA(th.glow || th.accent, .5));
  r.setProperty('--deep', th.bg);
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', isDark() ? th.bg : '#F1E7D3');
}
function hexA(hex, a){
  var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if(!m) return 'rgba(200,160,60,' + a + ')';
  var n = parseInt(m[1], 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
applyTheme(SET.theme);
applyFont(SET.fontSize);

/* ---------- yantra (inline SVG, per granth) ---------- */
function yantra(id){
  if(id === 'deviyaan'){
    var pet = '';
    for(var i = 0; i < 16; i++){
      pet += '<ellipse cx="100" cy="30" rx="9" ry="20" transform="rotate(' + (i*22.5) + ' 100 100)"/>';
    }
    return '<svg class="yantra" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="var(--accent)" stroke-width="0.7">' +
      '<g class="breathe">' +
      '<circle cx="100" cy="100" r="74"/><circle cx="100" cy="100" r="60"/>' +
      '<g opacity=".75">' + pet + '</g>' +
      '<path d="M100 34 L156 132 L44 132 Z"/><path d="M100 166 L44 68 L156 68 Z"/>' +
      '<path d="M100 52 L142 124 L58 124 Z"/><path d="M100 148 L58 76 L142 76 Z"/>' +
      '<path d="M100 70 L128 118 L72 118 Z"/><path d="M100 130 L72 82 L128 82 Z"/>' +
      '<circle cx="100" cy="100" r="5" fill="var(--accent)" stroke="none"/>' +
      '<rect x="14" y="14" width="172" height="172" opacity=".5"/>' +
      '</g></svg>';
  }
  var rays = '', dots = '';
  for(var k = 0; k < 48; k++){
    var a = k * 7.5 * Math.PI / 180;
    rays += '<line x1="' + (100+26*Math.cos(a)).toFixed(1) + '" y1="' + (100+26*Math.sin(a)).toFixed(1) +
            '" x2="' + (100+86*Math.cos(a)).toFixed(1) + '" y2="' + (100+86*Math.sin(a)).toFixed(1) + '"/>';
    if(k % 6 === 0) dots += '<circle cx="' + (100+70*Math.cos(a)).toFixed(1) + '" cy="' + (100+70*Math.sin(a)).toFixed(1) + '" r="1.6" fill="var(--accent)" stroke="none"/>';
  }
  return '<svg class="yantra" viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="var(--accent)" stroke-width="0.5">' +
    '<g class="spin"><g opacity=".8">' + rays + '</g>' + dots + '</g>' +
    '<g class="breathe"><circle cx="100" cy="100" r="26"/><circle cx="100" cy="100" r="52" opacity=".7"/><circle cx="100" cy="100" r="88" opacity=".5"/></g>' +
    '</svg>';
}

/* =========================================================
   ग्रंथ लोड और रेंडर
   ========================================================= */
var G = null;              /* चालू ग्रंथ का data */
var META = null;           /* registry entry */
var CARDS = [];            /* सभी पद-कार्ड, क्रम में */
var CUR = null;            /* {sectionId,n} जहाँ पाठक है */
var BM = [];               /* चालू ग्रंथ के बुकमार्क */
var PATH = 'a', DIFF = false;

function keyOf(v, sec){ return (sec.id || '') + ':' + v.n; }
function unit(){ return (G && G.unitLabel) || 'पद'; }
function bmKey(){ return 'granth:' + G.id + ':bookmarks'; }
function lrKey(){ return 'granth:' + G.id + ':lastRead'; }

function loadGranth(id, deep){
  var meta = REG.filter(function(r){ return r.id === id; })[0];
  if(!meta){ id = REG[0].id; meta = REG[0]; }
  META = meta;
  lsSet('granth:last', id);
  paintTabs(id);
  applyGranthTheme(meta.theme || {});
  if(window.GRANTH_DATA && window.GRANTH_DATA[id] && !meta.pending){ mount(window.GRANTH_DATA[id], deep); return; }

  $('#stage').innerHTML = '<div class="skel">' +
    '<i style="width:52%"></i><i style="width:78%"></i><i style="width:66%"></i><i style="width:84%"></i><i style="width:44%"></i></div>';
  var files = meta.files || [meta.file], i = 0;
  (function next(){
    if(i >= files.length){
      meta.pending = false;
      if(window.GRANTH_DATA && window.GRANTH_DATA[id]) mount(window.GRANTH_DATA[id], deep);
      else failed(id);
      return;
    }
    var sc = document.createElement('script');
    sc.src = files[i++];
    sc.onload = next;
    sc.onerror = function(){ failed(id); };
    document.head.appendChild(sc);
  })();
}
function failed(id){
  $('#stage').innerHTML = '<div class="loaderr">यह ग्रंथ लोड नहीं हो सका — दोबारा कोशिश करें।' +

function bindSwipe(){
  var x0 = null, y0 = null;
  $('#stage').addEventListener('touchstart', function(e){
    var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY;
  }, { passive:true });
  $('#stage').addEventListener('touchend', function(e){
    if(x0 == null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    if(document.body.dataset.path !== 'both' || innerWidth >= 768) return;
    var card = t.target.closest && t.target.closest('.v.two');
    if(!card) return;
    var cur = card.dataset.solo || RECS[0].key;
    var nxt = (cur === RECS[0].key) ? RECS[1].key : RECS[0].key;
    card.dataset.solo = nxt;
    var dots = $$('.swipehint i', card);
    dots.forEach(function(d, i){ d.classList.toggle('on', i === (nxt === RECS[0].key ? 0 : 1)); });
  }, { passive:true });
}

/* ---------- reveal / position / progress ---------- */
var revIO = null, posIO = null;
function observe(){
  if(revIO) revIO.disconnect();
  if(posIO) posIO.disconnect();
  if(!('IntersectionObserver' in window)){ CARDS.forEach(function(c){ c.classList.add('seen'); }); return; }
  revIO = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('seen'); revIO.unobserve(e.target); } });
  }, { rootMargin:'0px 0px 40px 0px', threshold:0 });
  var posT;
  posIO = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) CUR = { sectionId: e.target.dataset.sec, n: +e.target.dataset.n }; });
    clearTimeout(posT);
    posT = setTimeout(function(){ if(CUR && G) jSet(lrKey(), CUR); }, 600);
  }, { rootMargin:'-45% 0px -45% 0px', threshold:0 });
  CARDS.forEach(function(c){ revIO.observe(c); posIO.observe(c); });
}
var pbar = $('#pbar'), fab = $('#fab'), ticking = false;
window.addEventListener('scroll', function(){
  if(ticking) return; ticking = true;
  requestAnimationFrame(function(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    pbar.style.width = Math.max(0, Math.min(100, h > 0 ? (scrollY / h) * 100 : 0)) + '%';
    ticking = false;
  });
}, { passive:true });

/* ---------- पाठ क/ख + अंतर ---------- */
function normTok(t){ return t.replace(/[।॥!?,;:'"‘’“”()\-–—\s]/g, ''); }
function lcsSame(A, B){
  var n = A.length, m = B.length, i, j, dp = [];
  for(i = 0; i <= n; i++) dp.push(new Uint16Array(m + 1));
  for(i = n - 1; i >= 0; i--) for(j = m - 1; j >= 0; j--)
    dp[i][j] = (normTok(A[i]) === normTok(B[j])) ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  var fa = [], fb = [];
  for(i = 0; i < n; i++) fa.push(false);
  for(j = 0; j < m; j++) fb.push(false);
  i = 0; j = 0;
  while(i < n && j < m){
    if(normTok(A[i]) === normTok(B[j])){ fa[i] = fb[j] = true; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  return [fa, fb];
}
function flat(lines){
  var t = [], mp = [];
  lines.forEach(function(l, li){ l.split(/\s+/).filter(Boolean).forEach(function(w){ t.push(w); mp.push(li); }); });
  return { t:t, mp:mp };
}
function applyDiff(){
  document.body.dataset.diff = DIFF ? '1' : '0';
  CARDS.forEach(function(c){
    var dc = $('.dcount', c);
    if(DIFF && PATH === 'both' && c.linesB){
      var A = flat(c.linesA), B = flat(c.linesB), f = lcsSame(A.t, B.t);
      var put = function(spans, fl, flags){
        var by = {};
        fl.t.forEach(function(w, k){ (by[fl.mp[k]] = by[fl.mp[k]] || []).push(flags[k] ? esc(w) : '<i class="dw">' + esc(w) + '</i>'); });
        spans.forEach(function(sp, li){ if(by[li]) sp.innerHTML = by[li].join(' '); });
      };
      put(c.spansA, A, f[0]); put(c.spansB, B, f[1]);
      c.dataset.painted = '1';
      if(dc){
        var n = f[0].filter(function(x){ return !x; }).length + f[1].filter(function(x){ return !x; }).length;
        dc.textContent = n ? ('इस ' + unit() + ' में ' + n + ' शब्द-भेद') : ('इस ' + unit() + ' में कोई शब्द-भेद नहीं');
      }
    } else if(c.dataset.painted){
      c.spansA.forEach(function(sp, i){ sp.textContent = c.linesA[i]; });
      if(c.spansB) c.spansB.forEach(function(sp, i){ sp.textContent = c.linesB[i]; });
      delete c.dataset.painted;
    }
  });
}
function setPath(v, byUser){
  PATH = v;
  document.body.dataset.path = v;
  if(G) lsSet('granth:' + G.id + ':path', v);
  $$('.pseg button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.path === v ? 'true' : 'false'); });
  var both = (v === 'both');
  $('#difftog').style.display = both ? '' : 'none';
  var sb = $('#swapbtn'); if(sb && RECS) sb.style.display = both ? '' : 'none';
  applyDiff();
  if(byUser){
    bell();
    var name = both ? 'दोनों पाठ साथ-साथ' :
      (RECS ? (RECS.filter(function(r){ return r.key === v; })[0] || {}).full : (v === 'b' ? 'पाठ ख' : 'पाठ क'));
    toast(name, 2600);
  }

/* =========================================================
   श्रवण — केवल मूल पद, अर्थ कभी नहीं

var RATES = [0.8, 1, 1.2];
var rateIx = Math.max(0, RATES.indexOf(SET.ttsRate)); if(rateIx < 0) rateIx = 1;
function wantsB(){
  if(RECS) return (Sp.rec === RECS[1].key) || (PATH === RECS[1].key);
  return PATH === 'b';
}
function activeLines(c){ return (wantsB() && c.linesB) ? c.linesB : c.linesA; }
function activeSpans(c){ return (wantsB() && c.spansB) ? c.spansB : c.spansA; }

var Sp = {
  ok: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window), rec: null,
  voice: null, warned: false, idx: -1, line: 0, gen: 0, playing: false, paused: false, cont: false,
  pickVoice: function(){
    if(!this.ok) return;
    var v = speechSynthesis.getVoices() || []; if(!v.length) return;
    this.voice = v.filter(function(x){ return /^hi\b|^hi[-_]/i.test(x.lang); })[0] ||
                 v.filter(function(x){ return /^(mr|ne|sa|bn|gu)[-_]/i.test(x.lang); })[0] ||
                 v.filter(function(x){ return /^en[-_]IN/i.test(x.lang); })[0] || null;
  },
  start: function(i, cont){
    if(typeof pauseGaan === 'function') pauseGaan();
    if(!this.ok){ toast('इस ब्राउज़र में आवाज़ की सुविधा नहीं है', 3200); return false; }
    this.stop(true); this.gen++;
    this.idx = i; this.line = 0; this.cont = !!cont; this.playing = true; this.paused = false;
    if(!this.voice) this.pickVoice();
    if(!this.voice && !this.warned){ this.warned = true; toast('हिंदी आवाज़ नहीं मिली — फ़ोन की सेटिंग में हिंदी वाणी जोड़ें', 4200); }
    showBar(true); this.openCard(); this.say(); return true;
  },
  openCard: function(){
    var c = CARDS[this.idx]; if(!c) return;
    CARDS.forEach(function(x){ x.classList.remove('reading'); });
    c.classList.add('seen'); c.classList.add('reading');
    var nb = $('.vnum', c);
    $('#ab-n').textContent = nb ? nb.textContent : c.dataset.n;
    var ic = $('.vbtn.play .ico', c); if(ic) ic.innerHTML = svg(IC.pause);
    var r = c.getBoundingClientRect();
    if(r.top < 90 || r.bottom > innerHeight - 80 || this.cont)
      c.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block:'center' });
  },
  say: function(){
    var self = this, g = this.gen, c = CARDS[this.idx];
    if(!c || !this.playing) return;
    var LN = activeLines(c), SPN = activeSpans(c);
    if(this.line >= LN.length){ this.cardDone(); return; }
    var u = new SpeechSynthesisUtterance(LN[this.line]);
    if(this.voice) u.voice = this.voice;
    u.lang = this.voice ? this.voice.lang : 'hi-IN';
    u.rate = RATES[rateIx]; u.pitch = 1; u.volume = 1;
    var span = SPN[this.line];
    u.onstart = function(){ if(g === self.gen && span) span.classList.add('on'); };
    u.onend = function(){
      if(span) span.classList.remove('on');
      if(g !== self.gen || !self.playing) return;
      self.line++;
      setTimeout(function(){ if(g === self.gen && self.playing) self.say(); }, 240);
    };
    u.onerror = function(e){
      if(span) span.classList.remove('on');
      if(g !== self.gen) return;
      if(e && (e.error === 'interrupted' || e.error === 'canceled')) return;
      self.stop(); toast('आवाज़ शुरू नहीं हो पाई — फिर से बटन दबाएँ', 3000);
    };
    try{ speechSynthesis.speak(u); }catch(err){ this.stop(); toast('आवाज़ शुरू नहीं हो पाई', 2600); }
  },
  cardDone: function(){
    if(this.cont && this.idx + 1 < CARDS.length){
      this.gen++; this.idx++; this.line = 0; this.openCard();
      var self = this, g = this.gen;
      setTimeout(function(){ if(g === self.gen && self.playing) self.say(); }, 420);
    } else { var was = this.cont; this.stop(); if(was) toast('॥ पाठ पूर्ण हुआ ॥', 3000); }
  },
  pause: function(){ if(!this.playing) return; try{ speechSynthesis.pause(); }catch(e){} this.paused = true; $('#ab-play').innerHTML = svg(IC.play, 'f'); },
  resume: function(){ if(!this.playing) return; try{ speechSynthesis.resume(); }catch(e){} this.paused = false; $('#ab-play').innerHTML = svg(IC.pause); },
  jump: function(d){ var i = this.idx + d; if(i < 0 || i >= CARDS.length) return; this.start(i, this.cont); },
  restartLine: function(){
    if(!this.playing) return;
    this.gen++; var g = this.gen, self = this;
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(function(){ if(g === self.gen && self.playing) self.say(); }, 140);
  },
  stop: function(quiet){
    this.gen++; this.playing = false; this.paused = false;
    try{ speechSynthesis.cancel(); }catch(e){}
    CARDS.forEach(function(c){
      c.classList.remove('reading');
      var ic = $('.vbtn.play .ico', c); if(ic) ic.innerHTML = svg(IC.play, 'f');
      $$('.vtext span.on', c).forEach(function(s){ s.classList.remove('on'); });
    });
    $('#ab-play').innerHTML = svg(IC.pause);
    if(!quiet) showBar(false);
  }
};

function ripple(btn, e){
  if(REDUCED) return;
  var r = btn.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'ripple';
  s.style.left = ((e && e.clientX ? e.clientX : r.left + r.width/2) - r.left) + 'px';
  s.style.top  = ((e && e.clientY ? e.clientY : r.top + r.height/2) - r.top) + 'px';
  s.style.width = s.style.height = '14px';
  btn.appendChild(s); setTimeout(function(){ s.remove(); }, 620);
}
$('#stage').addEventListener('click', function(e){
  var t = e.target;
  var play = t.closest ? t.closest('.vbtn.play') : null;
  var bm = t.closest ? t.closest('.vbtn.bm') : null;
  if(play){
    var c = play.closest('.v'), i = CARDS.indexOf(c);
    ripple(play, e);
    if(play.dataset.rec) Sp.rec = play.dataset.rec;
    if(Sp.playing && Sp.idx === i){ if(Sp.paused) Sp.resume(); else Sp.pause(); }
    else { bell(); Sp.start(i, document.body.dataset.mode === 'shravan'); }
    return;
  }
  var cp = t.closest ? t.closest('.vbtn.copy') : null;
  if(cp){ ripple(cp, e); copyVerse(cp.closest('.v'), cp.dataset.rec); return; }
  if(bm){ ripple(bm, e); var c2 = bm.closest('.v'); toggleBM(c2.dataset.sec, c2.dataset.n); }
});


function verseTextOf(card, key){
  var id = card.dataset.n;
  if(!RECS){ return unit() + ' ' + id + '\n' + card.linesA.join('\n'); }
  var out = [];
  RECS.forEach(function(r){
    if(key && r.key !== key) return;
    var v = recText(r.key)[id];
    if(!v) return;
    out.push(r.full + (r.desc ? ' — ' + r.desc : '') + '\n' + v.mool.join('\n') + (v.arth ? '\n\nअर्थ — ' + v.arth : ''));
  });
  return '॥ ' + G.title + ' ॥ ' + unit() + ' ' + id + '\n\n' + out.join('\n\n— — —\n\n');
}
function copyVerse(card, key){
  var txt = verseTextOf(card, key);
  var done = function(){ bell(); toast('प्रतिलिपि हो गई', 2000); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('प्रतिलिपि नहीं हो पाई', 2200); }
  ta.remove();
}

/* =========================================================
   गायन — रिकॉर्ड किया हुआ पाठ, छंद के साथ चलता हुआ
   ========================================================= */
var GA = null, AU = null, FOLLOW = true, gaRates = [0.85, 1, 1.15], gaRi = 1, lastMark = -1;
function fmt(t){
  t = Math.max(0, Math.floor(t || 0));
  return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
}
function markKey(m){ return (m.sec || '') + ':' + m.n; }
function setupGaan(){
  GA = (window.GRANTH_AUDIO && window.GRANTH_AUDIO[G.id]) || null;
  stopGaan(true);
  $('#gn-play').innerHTML = svg(IC.play, 'f');
  $('#gn-follow').innerHTML = svg(IC.star, 'f');
  $('#gn-close').innerHTML = svg(IC.stop);
  var t = $('#tool-gaan');
  if(t) t.hidden = !GA;
  if(!GA) return;
  $('#gn-title').textContent = GA.title || 'गायन';
  $('#gn-sub').textContent = (GA.singer ? 'स्वर — ' + GA.singer : '') +
    (GA.markers && GA.markers.length ? ' · ' + GA.markers.length + ' निशान' : '');
  $('#gn-dur').textContent = fmt(GA.duration);
  var mk = '';
  (GA.markers || []).forEach(function(m){
    if(!GA.duration) return;
    mk += '<i style="left:' + (m.t / GA.duration * 100).toFixed(2) + '%"></i>';
  });
  $('#gn-marks').innerHTML = mk;
  /* जिन छंदों का समय मालूम है, उन पर गायन का बटन */
  var byKey = {};
  (GA.markers || []).forEach(function(m){ if(byKey[markKey(m)] == null) byKey[markKey(m)] = m.t; });
  CARDS.forEach(function(c){
    var t2 = byKey[c.dataset.sec + ':' + c.dataset.n];
    if(t2 == null) return;
    c.gaanAt = t2;
    var acts = $$('.vacts', c).pop();
    if(!acts) return;
    var b = document.createElement('button');
    b.className = 'vbtn gaan';
    b.type = 'button';
    b.setAttribute('aria-label', 'यहाँ से गायन सुनें');
    b.innerHTML = svg(IC.play, 'f') + '<span class="txt">गायन</span>';
    b.addEventListener('click', function(e){ ripple(b, e); playGaan(t2); });
    acts.insertBefore(b, acts.firstChild);
  });
}
function ensureAudio(){
  if(AU) return AU;
  AU = new Audio();
  AU.preload = 'none';
  AU.src = GA.src;
  AU.addEventListener('timeupdate', onGaanTime);
  AU.addEventListener('ended', function(){ stopGaan(); toast('॥ गायन पूर्ण ॥', 2600); });
  AU.addEventListener('error', function(){ stopGaan(); toast('गायन नहीं चल पाया — इंटरनेट जाँच लीजिए', 3400); });
  AU.addEventListener('loadedmetadata', function(){ if(AU.duration) $('#gn-dur').textContent = fmt(AU.duration); });
  return AU;
}
function playGaan(at){
  if(!GA) return;
  Sp.stop();                       /* श्रवण और गायन एक साथ नहीं */
  var a = ensureAudio();
  $('#gaanbar').classList.add('on');
  fab.classList.add('hide');
  if(at != null) a.currentTime = at;
  a.playbackRate = gaRates[gaRi];
  var pr = a.play();
  if(pr && pr.catch) pr.catch(function(){ toast('गायन शुरू नहीं हो पाया — फिर से दबाइए', 3000); });
  $('#gn-play').innerHTML = svg(IC.pause);
}
function pauseGaan(){ if(AU){ AU.pause(); $('#gn-play').innerHTML = svg(IC.play, 'f'); } }
function stopGaan(quiet){
  if(AU){ AU.pause(); }
  CARDS.forEach(function(c){ c.classList.remove('singing'); });
  lastMark = -1;
  $('#gn-play').innerHTML = svg(IC.play, 'f');
  if(!quiet){ $('#gaanbar').classList.remove('on'); fab.classList.remove('hide'); }
}
function onGaanTime(){
  if(!AU || !GA) return;
  var t = AU.currentTime, d = AU.duration || GA.duration || 1;
  $('#gn-time').textContent = fmt(t);
  var sk = $('#gn-seek');
  if(!sk.dataset.drag) sk.value = Math.round(t / d * 1000);
  var ms = GA.markers || [], i = -1;
  for(var k = 0; k < ms.length; k++){ if(ms[k].t <= t + 0.35) i = k; else break; }
  if(i === lastMark) return;
  lastMark = i;
  CARDS.forEach(function(c){ c.classList.remove('singing'); });
  if(i < 0) return;
  var m = ms[i], card = cardOf(m.sec, m.n);
  if(!card) return;
  card.classList.add('seen');
  card.classList.add('singing');
  $('#gn-sub').textContent = unit() + ' ' + m.n + ' — ' + (G.sections ?
      (G.sections.filter(function(x){ return x.id === m.sec; })[0] || {}).title || '' : '');
  if(FOLLOW){
    var r = card.getBoundingClientRect();
    if(r.top < 80 || r.bottom > innerHeight - 150)
      card.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' });
  }
}
$('#gn-play').addEventListener('click', function(){
  if(!GA) return;
  if(AU && !AU.paused) pauseGaan(); else playGaan(null);
});
$('#gn-close').addEventListener('click', function(){ stopGaan(); });
$('#gn-follow').addEventListener('click', function(){
  FOLLOW = !FOLLOW;

});
$('#gn-rate').addEventListener('click', function(){
  gaRi = (gaRi + 1) % gaRates.length;

  if(AU) AU.playbackRate = gaRates[gaRi];
});
(function(){
  var sk = $('#gn-seek');
  sk.addEventListener('input', function(){ sk.dataset.drag = '1'; });
  sk.addEventListener('change', function(){
    delete sk.dataset.drag;

  }
  sBody.innerHTML = h;
  if(tab === 'find') renderFind('');
}
function openSheet(t){ renderSheet(t || 'toc'); sheetOpen = true; sheet.classList.add('on'); scrim.classList.add('on'); }
function closeSheet(){ sheetOpen = false; sheet.classList.remove('on'); scrim.classList.remove('on'); }
$('#tool-gaan').addEventListener('click', function(){
  if(!GA) return;
  var bar = $('#gaanbar');
  if(bar.classList.contains('on')) stopGaan();
  else { bar.classList.add('on'); fab.classList.add('hide'); bell(); toast('गायन — ▶ दबाइए', 2400); }
});
$('#btn-index').addEventListener('click', function(){ openSheet(BM.length ? 'bm' : 'toc'); });
$('#btn-set').addEventListener('click', function(){ openSheet('set'); });
$('#sheet-x').addEventListener('click', closeSheet);
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && sheetOpen) closeSheet(); });
$$('.sheet .tabs button[data-tab]').forEach(function(b){ b.addEventListener('click', function(){ renderSheet(b.dataset.tab); }); });
sBody.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(e.target.id === 'find-q'){ renderFind(e.target.value); e.preventDefault(); }
  if(e.target.id === 'jump-n'){ var n = parseInt(e.target.value, 10); if(n){ closeSheet(); goTo(null, n, true); } e.preventDefault(); }
});
sBody.addEventListener('click', function(e){
  var t = e.target;
  var nav = t.closest ? t.closest('.snav') : null;
  if(nav){ closeSheet(); goTo(nav.dataset.sec, nav.dataset.n, true); return; }
  var del = t.closest ? t.closest('[data-del]') : null;
  if(del){ toggleBM(del.dataset.dsec || null, del.dataset.del); return; }
  var row = t.closest ? t.closest('.bmrow') : null;
  if(row){ closeSheet(); goTo(row.dataset.sec || null, row.dataset.n, true); return; }
  var th = t.closest ? t.closest('[data-th]') : null;
  if(th){ SET.theme = th.dataset.th; saveSet(); applyTheme(SET.theme); if(G && G.theme) applyGranthTheme(G.theme); renderSheet('set'); bell(); return; }
  var fs = t.closest ? t.closest('[data-fs]') : null;
  if(fs){ applyFont(parseFloat(fs.dataset.fs)); renderSheet('set'); return; }
  var rt = t.closest ? t.closest('[data-rt]') : null;
  if(rt){ rateIx = +rt.dataset.rt; SET.ttsRate = RATES[rateIx]; saveSet(); $('#ab-rate').textContent = RATES[rateIx] + '×'; renderSheet('set'); Sp.restartLine(); return; }
  if(t.id === 'jump-go' || (t.id === 'jump-n' && e.type === 'change')){
    var n = parseInt(($('#jump-n') || {}).value, 10);
    if(n) { closeSheet(); goTo(null, n, true); }
    return;
  }
  if(t.id === 'find-go'){ renderFind(($('#find-q') || {}).value); return; }
  var go = t.closest ? t.closest('[data-go]') : null;
  if(go){ closeSheet(); goTo(go.dataset.gsec || null, go.dataset.go, true); return; }
  var sw = t.closest ? t.closest('#bell-sw') : null;
  if(sw){ SET.bell = SET.bell ? 0 : 1; saveSet(); sw.setAttribute('aria-pressed', SET.bell ? 'true' : 'false'); if(SET.bell) bell(); }
});


/* ---------- खोज ---------- */
function searchAll(q){
  q = (q || '').trim();
  if(q.length < 2) return [];
  var res = [], seen = {};
  function scan(list, label){
    list.forEach(function(it){
      if(res.length > 60) return;
      var hay = it.text;
      var i = hay.indexOf(q);
      if(i < 0) return;
      var k = label + ':' + it.id;
      if(seen[k]) return; seen[k] = 1;
      res.push({ id: it.id, sec: it.sec, label: label,
                 snip: esc(hay.slice(Math.max(0, i - 28), i)) + '<mark>' + esc(hay.substr(i, q.length)) + '</mark>' + esc(hay.substr(i + q.length, 34)) });
    });
  }
  if(RECS){
    RECS.forEach(function(r){
      var T = recText(r.key), list = [];
      Object.keys(T).forEach(function(id){
        var v = T[id];
        list.push({ id: id, sec: null, text: v.mool.join(' ') + ' ' + (v.arth || '') });
      });
      scan(list, r.label);
    });
  } else {
    var list = [];
    G.sections.forEach(function(sec){
      sec.verses.forEach(function(v){
        list.push({ id: (v.n != null ? v.n : v.key), sec: sec.id, text: v.lines.join(' ') + ' ' + (v.artha || '') });
      });
    });
    scan(list, G.title);
  }
  return res;
}
function renderFind(q){
  var out = $('#find-out'); if(!out) return;
  var r = searchAll(q);
  if(!q || q.trim().length < 2){ out.innerHTML = '<div class="empty">कम से कम दो अक्षर लिखिए</div>'; return; }
  if(!r.length){ out.innerHTML = '<div class="empty">कुछ नहीं मिला</div>'; return; }
  out.innerHTML = '<div class="empty" style="padding:.4rem 0 .8rem">' + r.length + ' परिणाम</div>' +
    r.map(function(x){
      return '<button class="sres" data-go="' + esc(String(x.id)) + '" data-gsec="' + esc(x.sec || '') + '">' +
             '<small>' + esc(x.label) + ' · ' + esc(unit()) + ' ' + esc(String(x.id)) + '</small><b>…' + x.snip + '…</b></button>';
    }).join('');
}

/* ---------- शुरुआत + deep link ---------- */
function parseHash(){
  var h = (location.hash || '').replace(/^#/, '');
  if(!h) return null;
  var p = h.split('/');
  var id = p[0];
  if(!REG.some(function(r){ return r.id === id; })) return null;
  var deep = null;
  if(p[1]){
    var q = p[1].split(':');
    deep = q.length > 1 ? { sectionId: q[0], n: +q[1] } : { sectionId: null, n: +q[0] };
    if(!deep.n) deep = null;
  }
  return { id: id, deep: deep };
}
var startAt = parseHash();
setMode(SET.mode, false);
loadGranth(startAt ? startAt.id : lsGet('granth:last', REG[0] && REG[0].id), startAt && startAt.deep);
addEventListener('hashchange', function(){
  var h = parseHash();
  if(!h) return;
  if(!META || h.id !== META.id) loadGranth(h.id, h.deep);
  else if(h.deep) goTo(h.deep.sectionId, h.deep.n, true);
});
})();
